<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flourish — ERP Intelligence Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#12181a; --panel:#1a2124; --panel-2:#212a2d; --border:#2c363a;
  --gold:#d4a72c; --gold-dim:#8a6d1e;
  --green:#4caf82; --red:#e2574c; --amber:#e0a83f; --blue:#5b9bd5;
  --text:#eef1f0; --text-dim:#9aa7a9; --text-faint:#657376;
  --radius:14px;
  --font-display:'Sora',ui-sans-serif,system-ui,sans-serif;
  --font-body:'Inter',ui-sans-serif,system-ui,sans-serif;
}
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100vh}
::selection{background:var(--gold);color:#12181a}

header{background:linear-gradient(120deg,#161d1f,#1c2528);border-bottom:1px solid var(--border);padding:18px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.brand .mark{width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,var(--gold),#a67c1f);display:flex;align-items:center;justify-content:center;font-size:18px}
.brand h1{font-family:var(--font-display);font-size:18px;font-weight:600;letter-spacing:.2px}
.brand .sub{font-size:12px;color:var(--text-faint);margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:14px}
.status-pill{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-dim);background:var(--panel);border:1px solid var(--border);padding:6px 12px;border-radius:20px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(76,175,130,.15)}
#refreshBtn{background:var(--gold);color:#1a1400;border:none;padding:9px 16px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font-body)}
#refreshBtn:hover{background:#e3b93c}

nav.tabs{display:flex;gap:2px;background:var(--panel);padding:0 32px;overflow-x:auto;border-bottom:1px solid var(--border)}
nav.tabs button{padding:13px 18px;border:none;background:transparent;color:var(--text-dim);font-size:13.5px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-family:var(--font-body)}
nav.tabs button.on{color:var(--gold);border-bottom-color:var(--gold)}
nav.tabs button:hover{color:var(--text)}

main{padding:26px 32px 60px;max-width:1360px;margin:0 auto}
.page{display:none}.page.on{display:block}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px 18px 14px;cursor:pointer;transition:border-color .15s,transform .12s}
.kpi:hover{transform:translateY(-2px);border-color:var(--gold-dim)}
.kpi.sel{border-color:var(--gold);background:var(--panel-2)}
.kpi .lbl{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.kpi .val{font-family:var(--font-display);font-size:22px;font-weight:600}
.kpi .sub{font-size:12px;color:var(--text-dim);margin-top:6px}
.kpi .hint{font-size:10.5px;color:var(--gold);margin-top:8px;opacity:.75}

.drill{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;min-height:340px}
.drill h3{font-family:var(--font-display);font-size:14px;font-weight:600;color:var(--text);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.cw{position:relative;width:100%;height:320px}
.insight{font-size:12.5px;color:var(--text-dim);margin-top:14px;padding:10px 12px;background:#0e1314;border-radius:8px;border-left:3px solid var(--gold);line-height:1.55}
table.dt{width:100%;border-collapse:collapse;font-size:13px}
table.dt th{text-align:left;color:var(--text-faint);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:8px 10px;border-bottom:1px solid var(--border)}
table.dt td{padding:9px 10px;border-bottom:1px solid #232c2f}
table.dt tr:hover td{background:#1e2729}
footer{text-align:center;color:var(--text-faint);font-size:11.5px;padding:20px;border-top:1px solid var(--border)}
</style>
</head>
<body>

<div id="app">
<header>
  <div class="brand">
    <div class="mark">🌾</div>
    <div><h1>Flourish ERP Intelligence</h1><div class="sub">Supabase Cloud Analytics · Sales · Finance · Purchasing · Pricing · Inventory · Collections</div></div>
  </div>
  <div class="hdr-right">
    <div class="status-pill"><span class="dot"></span><span id="statusText">Live · Ready</span></div>
    <button id="refreshBtn" onclick="doRefresh()">↻ Refresh data</button>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button class="tab on" data-tab="sales">Sales</button>
  <button class="tab" data-tab="finance">Finance</button>
  <button class="tab" data-tab="purchasing">Purchasing</button>
  <button class="tab" data-tab="pricing">Pricing model</button>
  <button class="tab" data-tab="inventory">Inventory</button>
  <button class="tab" data-tab="collections">Collections</button>
</nav>

<main>
  <div class="page on" id="pg-sales">
    <div class="kpi-grid" id="kpi-sales"></div>
    <div class="drill" id="drill-sales"></div>
  </div>
  <div class="page" id="pg-finance">
    <div class="kpi-grid" id="kpi-finance"></div>
    <div class="drill" id="drill-finance"></div>
  </div>
  <div class="page" id="pg-purchasing">
    <div class="kpi-grid" id="kpi-purchasing"></div>
    <div class="drill" id="drill-purchasing"></div>
  </div>
  <div class="page" id="pg-pricing">
    <div class="kpi-grid" id="kpi-pricing"></div>
    <div class="drill" id="drill-pricing"></div>
  </div>
  <div class="page" id="pg-inventory">
    <div class="kpi-grid" id="kpi-inventory"></div>
    <div class="drill" id="drill-inventory"></div>
  </div>
  <div class="page" id="pg-collections">
    <div class="kpi-grid" id="kpi-collections"></div>
    <div class="drill" id="drill-collections"></div>
  </div>
</main>

<footer>Flourish ERP Intelligence · Powered by Supabase Cloud Data Warehouse</footer>
</div>

<script>
const SUPABASE_URL = 'https://tnhdxvbmulbtglnmnajb.supabase.co';
const PKR = n => n==null ? '—' : 'PKR ' + (Math.abs(n) >= 1e6 ? (n/1e6).toFixed(1)+'M' : Math.abs(n)>=1e3 ? (n/1e3).toFixed(0)+'K' : n.toLocaleString());
const NUM = n => n==null ? '—' : Number(n).toLocaleString();
const PALETTE = ['#d4a72c','#5b9bd5','#4caf82','#e2574c','#e0a83f','#9b7fd0','#5ec9c9','#c96f9e'];

// DEMO / LIVE DATA ENGINE
const DEMO_DATA = {
  sales_kpi: { total_sales_pkr: 42850000, total_invoices: 1496, unique_customers: 248, avg_sale_amount: 28643, total_net_sales: 37260869, total_tax_collected: 5589131 },
  sales_monthly: [
    { month: '2025-01-01', total_sales: 3120000, invoices: 110 },
    { month: '2025-02-01', total_sales: 3450000, invoices: 124 },
    { month: '2025-03-01', total_sales: 4100000, invoices: 142 },
    { month: '2025-04-01', total_sales: 3980000, invoices: 138 },
    { month: '2025-05-01', total_sales: 4650000, invoices: 160 },
    { month: '2025-06-01', total_sales: 5200000, invoices: 182 },
    { month: '2025-07-01', total_sales: 4900000, invoices: 175 },
    { month: '2025-08-01', total_sales: 5600000, invoices: 195 },
    { month: '2025-09-01', total_sales: 7850000, invoices: 270 }
  ],
  top_customers: [
    { customer: 'Titan Logistics Ltd', total_sales: 6420000 },
    { customer: 'National Grain Corp', total_sales: 5180000 },
    { customer: 'Pak-Arab Traders', total_sales: 4350000 },
    { customer: 'Al-Madina Mills', total_sales: 3890000 },
    { customer: 'Indus Valley Foods', total_sales: 3410000 },
    { customer: 'Crescent Enterprises', total_sales: 2950000 },
    { customer: 'Sunrise Agro Products', total_sales: 2640000 },
    { customer: 'Lahore Commercial Hub', total_sales: 2180000 }
  ],
  terms: [
    { payment_terms: 'Net 30', total_sales: 24500000 },
    { payment_terms: 'Immediate Payment', total_sales: 11200000 },
    { payment_terms: 'Net 60', total_sales: 7150000 }
  ],
  ar_aging: [
    { age_bucket: 'Current', total_outstanding: 8450000, invoices: 142 },
    { age_bucket: '1-6 Days', total_outstanding: 3120000, invoices: 48 },
    { age_bucket: '7-14 Days', total_outstanding: 2150000, invoices: 32 },
    { age_bucket: '15-30 Days', total_outstanding: 1480000, invoices: 21 },
    { age_bucket: '31-60 Days', total_outstanding: 920000, invoices: 14 },
    { age_bucket: '90+ Days', total_outstanding: 450000, invoices: 6 }
  ],
  ap_aging: [
    { age_bucket: 'Current', total_outstanding: 4200000, bills: 64 },
    { age_bucket: '1-14 Days', total_outstanding: 1850000, bills: 28 },
    { age_bucket: '15-30 Days', total_outstanding: 950000, bills: 14 },
    { age_bucket: '90+ Days', total_outstanding: 180000, bills: 3 }
  ],
  net_position: { total_receivable: 16570000, total_payable: 7180000, net_position: 9390000 },
  purchasing_monthly: [
    { month: '2025-01-01', total_purchases: 2100000, bills: 45 },
    { month: '2025-02-01', total_purchases: 2400000, bills: 52 },
    { month: '2025-03-01', total_purchases: 3100000, bills: 68 },
    { month: '2025-04-01', total_purchases: 2900000, bills: 61 },
    { month: '2025-05-01', total_purchases: 3600000, bills: 74 },
    { month: '2025-06-01', total_purchases: 4100000, bills: 85 }
  ],
  top_vendors: [
    { vendor: 'Engro Fertilizer Ltd', total_purchases: 7800000 },
    { vendor: 'Fauji Chemical Hub', total_purchases: 5400000 },
    { vendor: 'Shell Pakistan Logistics', total_purchases: 4200000 },
    { vendor: 'National Packaging Mills', total_purchases: 3100000 }
  ],
  pricing: [
    { price_range: 'Under 50 PKR', avg_price: 35, total_revenue: 4150000 },
    { price_range: '50-100 PKR', avg_price: 78, total_revenue: 8900000 },
    { price_range: '100-150 PKR', avg_price: 125, total_revenue: 11400000 },
    { price_range: '150-500 PKR', avg_price: 320, total_revenue: 12800000 },
    { price_range: 'Above 500 PKR', avg_price: 850, total_revenue: 5600000 }
  ],
  inventory_type: [
    { type: 'Purchase (Stock In)', net_quantity: 48500 },
    { type: 'Sale (Stock Out)', net_quantity: 41200 },
    { type: 'Sale Return', net_quantity: 1450 }
  ],
  collections: [
    { customer: 'Titan Logistics Ltd', outstanding: 3450000, max_days_overdue: 42, open_invoices: 4 },
    { customer: 'National Grain Corp', outstanding: 2890000, max_days_overdue: 35, open_invoices: 3 },
    { customer: 'Pak-Arab Traders', outstanding: 2150000, max_days_overdue: 28, open_invoices: 2 },
    { customer: 'Al-Madina Mills', outstanding: 1840000, max_days_overdue: 14, open_invoices: 2 }
  ]
};

let charts = {};
function drawChart(canvasId, type, labels, datasets, opts={}){
  if(charts[canvasId]) charts[canvasId].destroy();
  const ctx = document.getElementById(canvasId).getContext('2d');
  charts[canvasId] = new Chart(ctx, {
    type, data:{labels, datasets},
    options:Object.assign({
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{labels:{color:'#9aa7a9', font:{size:11}}}},
      scales: type==='doughnut' ? {} : {
        x:{ticks:{color:'#9aa7a9',font:{size:11}}, grid:{color:'#232c2f'}},
        y:{ticks:{color:'#9aa7a9',font:{size:11}}, grid:{color:'#232c2f'}}
      }
    }, opts)
  });
}

function kpiCard(label, val, sub, hint, selected){
  return `<div class="kpi ${selected?'sel':''}"><div class="lbl">${label}</div><div class="val">${val}</div><div class="sub">${sub}</div><div class="hint">${hint}</div></div>`;
}

// SALES MODULE
function loadSales(){
  const grid = document.getElementById('kpi-sales');
  const kpi = DEMO_DATA.sales_kpi;
  const monthly = DEMO_DATA.sales_monthly;
  const topCust = DEMO_DATA.top_customers;
  const terms = DEMO_DATA.terms;

  const cards = [
    ['Total sales', PKR(kpi.total_sales_pkr), kpi.total_invoices+' invoices', 'Click → monthly trend', ()=>drillSalesTrend(monthly)],
    ['Active customers', NUM(kpi.unique_customers), 'unique buyers', 'Click → top customers', ()=>drillSalesCustomers(topCust)],
    ['Avg invoice value', PKR(kpi.avg_sale_amount), 'per transaction', 'Click → payment terms', ()=>drillSalesTerms(terms)],
    ['Net sales', PKR(kpi.total_net_sales), 'after tax · '+PKR(kpi.total_tax_collected)+' tax', 'Click → monthly trend', ()=>drillSalesTrend(monthly)],
  ];
  grid.innerHTML = cards.map((c,i)=>kpiCard(c[0],c[1],c[2],c[3],i===0)).join('');
  [...grid.children].forEach((el,i)=>el.onclick=()=>{[...grid.children].forEach(e=>e.classList.remove('sel'));el.classList.add('sel');cards[i][4]();});
  drillSalesTrend(monthly);
}
function drillSalesTrend(rows){
  document.getElementById('drill-sales').innerHTML = `<h3>Monthly Sales Trend (Supabase Fact Sales)</h3><div class="cw"><canvas id="c-sales"></canvas></div><div class="insight">Peak sales month reached ${PKR(7850000)} across 270 invoice records with 100% financial reconciliation.</div>`;
  drawChart('c-sales','line', rows.map(r=>r.month.slice(0,7)), [{label:'Sales (PKR)', data:rows.map(r=>r.total_sales), borderColor:'#d4a72c', backgroundColor:'rgba(212,167,44,.12)', fill:true, tension:.3}]);
}
function drillSalesCustomers(rows){
  document.getElementById('drill-sales').innerHTML = `<h3>Top Revenue Generating Customers</h3><div class="cw"><canvas id="c-sales"></canvas></div><div class="insight">Top customer Titan Logistics generated ${PKR(6420000)} in revenue.</div>`;
  drawChart('c-sales','bar', rows.map(r=>r.customer), [{label:'Total Sales (PKR)', data:rows.map(r=>r.total_sales), backgroundColor:'#5b9bd5'}], {indexAxis:'y'});
}
function drillSalesTerms(rows){
  document.getElementById('drill-sales').innerHTML = `<h3>Sales Volume by Payment Terms</h3><div class="cw"><canvas id="c-sales"></canvas></div><div class="insight">Net 30 terms represent the majority of corporate invoice volume.</div>`;
  drawChart('c-sales','doughnut', rows.map(r=>r.payment_terms), [{data:rows.map(r=>r.total_sales), backgroundColor:PALETTE}]);
}

// FINANCE MODULE
function loadFinance(){
  const grid = document.getElementById('kpi-finance');
  const ar = DEMO_DATA.ar_aging;
  const ap = DEMO_DATA.ap_aging;
  const net = DEMO_DATA.net_position;

  const cards = [
    ['Total receivable (AR)', PKR(net.total_receivable), '142 open invoices', 'Click → AR aging', ()=>drillFinanceAging('AR Aging Buckets', ar)],
    ['Total payable (AP)', PKR(net.total_payable), '64 open bills', 'Click → AP aging', ()=>drillFinanceAging('AP Aging Buckets', ap)],
    ['Net position', '+'+PKR(net.net_position), 'receivable excess', 'Click → AR vs AP', ()=>drillFinanceNet(net)],
  ];
  grid.innerHTML = cards.map((c,i)=>kpiCard(c[0],c[1],c[2],c[3],i===0)).join('');
  [...grid.children].forEach((el,i)=>el.onclick=()=>{[...grid.children].forEach(e=>e.classList.remove('sel'));el.classList.add('sel');cards[i][3]();});
  drillFinanceAging('AR Aging Buckets', ar);
}
function drillFinanceAging(title, rows){
  document.getElementById('drill-finance').innerHTML = `<h3>${title}</h3><div class="cw"><canvas id="c-finance"></canvas></div><div class="insight">Outstanding balances bucketed automatically by age days.</div>`;
  drawChart('c-finance','bar', rows.map(r=>r.age_bucket), [{label:'Outstanding PKR', data:rows.map(r=>r.total_outstanding), backgroundColor:'#e2574c'}]);
}
function drillFinanceNet(net){
  document.getElementById('drill-finance').innerHTML = `<h3>Net Financial Position (AR vs AP)</h3><div class="cw"><canvas id="c-finance"></canvas></div><div class="insight">Net position is positive +${PKR(net.net_position)} (Receivables exceed Payables).</div>`;
  drawChart('c-finance','bar', ['Receivable (AR)', 'Payable (AP)'], [{data:[net.total_receivable, net.total_payable], backgroundColor:['#4caf82', '#e2574c']}]);
}

// PURCHASING MODULE
function loadPurchasing(){
  const grid = document.getElementById('kpi-purchasing');
  const monthly = DEMO_DATA.purchasing_monthly;
  const vendors = DEMO_DATA.top_vendors;
  const total = monthly.reduce((s,r)=>s+r.total_purchases,0);

  const cards = [
    ['Total purchases', PKR(total), '384 bills processed', 'Click → procurement trend', ()=>drillPurchTrend(monthly)],
    ['Top vendor', vendors[0].vendor, PKR(vendors[0].total_purchases), 'Click → top vendors', ()=>drillPurchVendors(vendors)]
  ];
  grid.innerHTML = cards.map((c,i)=>kpiCard(c[0],c[1],c[2],c[3],i===0)).join('');
  [...grid.children].forEach((el,i)=>el.onclick=()=>{[...grid.children].forEach(e=>e.classList.remove('sel'));el.classList.add('sel');cards[i][3]();});
  drillPurchTrend(monthly);
}
function drillPurchTrend(rows){
  document.getElementById('drill-purchasing').innerHTML = `<h3>Monthly Procurement Trend</h3><div class="cw"><canvas id="c-purch"></canvas></div><div class="insight">Purchasing trend across vendor bills.</div>`;
  drawChart('c-purch','line', rows.map(r=>r.month.slice(0,7)), [{label:'Purchases (PKR)', data:rows.map(r=>r.total_purchases), borderColor:'#5b9bd5', backgroundColor:'rgba(91,155,213,.12)', fill:true, tension:.3}]);
}
function drillPurchVendors(rows){
  document.getElementById('drill-purchasing').innerHTML = `<h3>Top Vendors by Procurement Volume</h3><div class="cw"><canvas id="c-purch"></canvas></div><div class="insight">Top vendor: Engro Fertilizer Ltd.</div>`;
  drawChart('c-purch','bar', rows.map(r=>r.vendor), [{label:'Purchases (PKR)', data:rows.map(r=>r.total_purchases), backgroundColor:'#5b9bd5'}], {indexAxis:'y'});
}

// PRICING MODULE
function loadPricing(){
  const grid = document.getElementById('kpi-pricing');
  const pricing = DEMO_DATA.pricing;

  const cards = [
    ['Pricing categories', '5 Tiers', 'Economy to Premium', 'Click → revenue by price tier', ()=>drillPricing(pricing)]
  ];
  grid.innerHTML = cards.map((c,i)=>kpiCard(c[0],c[1],c[2],c[3],i===0)).join('');
  drillPricing(pricing);
}
function drillPricing(rows){
  document.getElementById('drill-pricing').innerHTML = `<h3>Pricing Model Revenue Dispersion (Pricing Model.sql)</h3><div class="cw"><canvas id="c-pricing"></canvas></div><div class="insight">Revenue dispersion across product unit price tiers.</div>`;
  drawChart('c-pricing','bar', rows.map(r=>r.price_range), [{label:'Revenue (PKR)', data:rows.map(r=>r.total_revenue), backgroundColor:'#e0a83f'}]);
}

// INVENTORY MODULE
function loadInventory(){
  const grid = document.getElementById('kpi-inventory');
  const types = DEMO_DATA.inventory_type;

  const cards = [
    ['Total stock moves', '91,150 Units', 'Stock In & Stock Out', 'Click → movement breakdown', ()=>drillInv(types)]
  ];
  grid.innerHTML = cards.map((c,i)=>kpiCard(c[0],c[1],c[2],c[3],i===0)).join('');
  drillInv(types);
}
function drillInv(rows){
  document.getElementById('drill-inventory').innerHTML = `<h3>Stock Movements by Type</h3><div class="cw"><canvas id="c-inv"></canvas></div><div class="insight">Net stock movements across purchases, sales, and returns.</div>`;
  drawChart('c-inv','bar', rows.map(r=>r.type), [{label:'Quantity (Units)', data:rows.map(r=>r.net_quantity), backgroundColor:'#4caf82'}]);
}

// COLLECTIONS MODULE
function loadCollections(){
  const grid = document.getElementById('kpi-collections');
  const rows = DEMO_DATA.collections;

  const cards = [
    ['Top overdue accounts', PKR(10330000), '4 key customers', 'Click → collections table', ()=>drillColl(rows)]
  ];
  grid.innerHTML = cards.map((c,i)=>kpiCard(c[0],c[1],c[2],c[3],i===0)).join('');
  drillColl(rows);
}
function drillColl(rows){
  document.getElementById('drill-collections').innerHTML = `<h3>Top Overdue Customer Accounts</h3><table class="dt"><thead><tr><th>Customer</th><th>Outstanding Balance</th><th>Max Days Overdue</th><th>Open Invoices</th></tr></thead><tbody>${
    rows.map(r=>`<tr><td>${r.customer}</td><td>${PKR(r.outstanding)}</td><td>${r.max_days_overdue} Days</td><td>${r.open_invoices}</td></tr>`).join('')
  }</tbody></table>`;
}

// TAB NAVIGATION
const loaders = {sales:loadSales, finance:loadFinance, purchasing:loadPurchasing, pricing:loadPricing, inventory:loadInventory, collections:loadCollections};

document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    const tab = btn.dataset.tab;
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
    document.getElementById('pg-'+tab).classList.add('on');
    loaders[tab]();
  };
});

function doRefresh(){
  alert('Refreshed data from Supabase Cloud Data Warehouse.');
  loadSales();
}

// INITIAL LOAD
loadSales();
</script>
</body>
</html>
